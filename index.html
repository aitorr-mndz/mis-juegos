<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Colección de Videojuegos</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
</head>
<body>

    <div class="web-container">
        <!-- CABECERA PRINCIPAL Y CENTRADA -->
        <header class="app-header">
            <h1>🎮 Mi Colección de Videojuegos</h1>
        </header>

        <!-- 1. NAVEGACIÓN PRINCIPAL CENTRADA -->
        <nav class="main-navigation">
            <button class="nav-item active" onclick="changeCollection('principal', this)">
                <span class="nav-icon">🎮</span><span class="nav-text">Mi Colección</span>
            </button>
            <button class="nav-item" onclick="changeCollection('otros', this)">
                <span class="nav-icon">📁</span><span class="nav-text">Otros Juegos</span>
            </button>
            <button class="nav-item" onclick="changeCollection('mapas', this)">
                <span class="nav-icon">🗺️</span><span class="nav-text">Mapas</span>
            </button>
            <button class="nav-item" onclick="changeCollection('calendario', this)">
                <span class="nav-icon">📅</span><span class="nav-text">Mi Calendario</span>
            </button>
            <button class="nav-item" onclick="changeCollection('setup', this)">
                <span class="nav-icon">🖥️</span><span class="nav-text">Mi Setup</span>
            </button>
        </nav>
        
        <!-- ZONA DE FILTROS SUPERIORES -->
        <div class="top-filters-container">
            <!-- FILTROS DE ESTADO Y BUSCADOR -->
            <div class="search-filter-row">
                <!-- Botones de Estado (Solo se ven en PC) -->
                <div id="sub-filters" class="pc-status-filters">
                    <button class="filter-btn active" onclick="filterGames('todos', this)">Todos</button>
                    <button class="filter-btn" onclick="filterGames('pendiente', this)">Por jugar ⏳</button>
                    <button class="filter-btn" onclick="filterGames('jugando', this)">Jugando 🕹️</button>
                    <button class="filter-btn" onclick="filterGames('completado', this)">Completados 🏆</button>
                    <button class="filter-btn" onclick="filterGames('favoritos', this)">Favoritos ❤️</button>
                    <button class="filter-btn" onclick="filterGames('noadquirido', this)">No Adquirido 🛑</button>
                </div>

                <!-- Desplegable de Estado (Solo se ve en Móvil) -->
                <select id="mobile-sub-filters" class="mobile-status-dropdown" onchange="filterGamesFromSelect(this.value)">
                    <option value="todos">📋 Mostrar Todos los Estados</option>
                    <option value="pendiente">⏳ Por jugar</option>
                    <option value="jugando">🕹️ Jugando</option>
                    <option value="completado">🏆 Completados</option>
                    <option value="favoritos">❤️ Mis Favoritos</option>
                    <option value="noadquirido">🛑 No Adquirido</option>
                </select>

                <!-- Campo de Búsqueda -->
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="game-search" placeholder="Buscar juego por nombre..." oninput="searchGames()">
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="app-main-content">
            <!-- Estadísticas -->
            <div class="stats-container" id="stats-panel">
                <div class="stat-box todos"><span class="stat-number" id="count-todos">0</span><span class="stat-label">Total Juegos</span></div>
                <div class="stat-box pendiente"><span class="stat-number" id="count-pendiente">0</span><span class="stat-label">Por Jugar ⏳</span></div>
                <div class="stat-box jugando"><span class="stat-number" id="count-jugando">0</span><span class="stat-label">Jugando 🕹️</span></div>
                <div class="stat-box completado"><span class="stat-number" id="count-completado">0</span><span class="stat-label">Pasados 🏆</span></div>
                <div class="stat-box progreso">
                    <span class="stat-number" id="progress-percent">0%</span>
                    <span class="stat-label">Progreso Total</span>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
                </div>
            </div>

            <!-- Grids de Contenido -->
            <div class="games-grid" id="games-grid"></div>
            
            <div id="calendar-container" style="display: none;">
                <h2 id="calendar-month-title">📅 Planificador</h2>
                <div class="calendar-weekdays"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
                <div class="calendar-days-grid" id="calendar-days-grid"></div>
            </div>
            
            <!-- APARTADO MI SETUP -->
            <div id="setup-container" style="display: none;">
                <div class="games-grid" id="setup-grid"></div>
            </div>

            <!-- APARTADO MAPAS -->
            <div id="mapas-container" style="display: none;">
                <div class="games-grid" id="mapas-grid"></div>
            </div>

        </main>
    </div>

    <!-- Modal de mapas -->
    <div id="mapa-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; justify-content:center; align-items:center;" onclick="cerrarMapa()">
        <img id="mapa-gigante" src="" alt="Mapa ampliado" style="max-width:95%; max-height:90%; border-radius:8px;">
    </div>

    <script src="app.js"></script>
</body>
</html>
