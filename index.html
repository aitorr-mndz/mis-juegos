<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colección de Videojuegos</title>
    <!-- Enlace al CSS con rompe-caché integrado -->
    <link rel="stylesheet" href="style.css?v=1.3">
    <!-- Enlace al manifiesto de la PWA para instalación -->
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('¡PWA Activada!', reg))
            .catch(err => console.log('Fallo PWA', err));
        });
      }
    </script>
</head>
<body>

    <div class="web-container">
        
        <!-- Título Principal -->
        <h1>🎮 Mi Colección de Videojuegos</h1>

        <!-- Contenedor del Menú Principal -->
        <div class="filters-wrapper">
            <!-- Menú de Botones (Solo visible en PC) -->
            <div class="filters pc-only-menu">
                <button class="collection-btn active" onclick="changeCollection('principal', this)">🎮 Mi Colección</button>
                <button class="collection-btn" onclick="changeCollection('otros', this)">📁 Otros Juegos</button>
                <button class="collection-btn" onclick="changeCollection('mapas', this)">🗺️ Mapas</button>
                <button class="collection-btn" onclick="changeCollection('calendario', this)">📅 Mi Calendario</button>
                <button class="collection-btn" onclick="changeCollection('setup', this)">🖥️ Mi Setup</button>
            </div>
            
            <!-- Selector Desplegable (Solo visible en Móviles) -->
            <select class="mobile-nav-select mobile-only-menu" onchange="changeCollectionFromSelect(this.value)">
                <option value="principal">🎮 Mi Colección</option>
                <option value="otros">📁 Otros Juegos</option>
                <option value="mapas">🗺️ Mapas</option>
                <option value="calendario">📅 Mi Calendario</option>
                <option value="setup">🖥️ Mi Setup</option>
            </select>
        </div>

        <!-- Layout Base: Contiene la barra lateral de logos y el panel central -->
        <div class="app-layout">
            
            <!-- Barra Lateral de Plataformas (Se convierte en fila horizontal en móviles) -->
            <div class="sidebar-platforms" id="sidebar-plat">
                <button class="sidebar-plat-btn active" onclick="filterByPlatform('todas', this)">
                    <span class="plat-all-icon">🌐</span>
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('Steam', this)">
                    <img src="Logos/steam_logo.png" alt="Steam">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('PlayStation 5', this)">
                    <img src="Logos/ps5_logo.png" alt="PS5">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('Nintendo Switch 2', this)">
                    <img src="Logos/switch_logo.png" alt="Switch 2">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('Epic Games', this)">
                    <img src="Logos/epic_logo.png" alt="Epic">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('PC', this)">
                    <img src="Logos/pc_logo.png" alt="PC">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('PlayStation 2', this)">
                    <img src="Logos/ps2_logo.png" alt="PS2">
                </button>
                <button class="sidebar-plat-btn" onclick="filterByPlatform('PlayStation 3', this)">
                    <img src="Logos/ps3_logo.png" alt="PS3">
                </button>
            </div>

            <!-- Panel de Contenido Principal -->
            <div style="flex-grow: 1; width: 100%;">
                
                <!-- Panel Estadístico -->
                <div class="stats-container" id="stats-panel">
                    <div class="stat-box todos">
                        <span class="stat-number" id="count-todos">0</span>
                        <span class="stat-label">Total Juegos</span>
                    </div>
                    <div class="stat-box pendiente">
                        <span class="stat-number" id="count-pendiente">0</span>
                        <span class="stat-label">Por Jugar ⏳</span>
                    </div>
                    <div class="stat-box jugando">
                        <span class="stat-number" id="count-jugando">0</span>
                        <span class="stat-label">Jugando 🕹️</span>
                    </div>
                    <div class="stat-box completado">
                        <span class="stat-number" id="count-completado">0</span>
                        <span class="stat-label">Pasados 🏆</span>
                    </div>
                    <div class="stat-box progreso">
                        <span class="stat-number" id="progress-percent">0%</span>
                        <span class="stat-label">Progreso Total</span>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Contenedor del Buscador y Subfiltros -->
                <div class="sub-filters-wrapper">
                    <!-- Botones Subfiltros (Solo PC) -->
                    <div id="sub-filters" class="filters pc-only-menu" style="margin-bottom: 20px;">
                        <button class="filter-btn active" onclick="filterGames('todos', this)">Todos</button>
                        <button class="filter-btn" onclick="filterGames('pendiente', this)">Por jugar ⏳</button>
                        <button class="filter-btn" onclick="filterGames('jugando', this)">Jugando 🕹️</button>
                        <button class="filter-btn" onclick="filterGames('completado', this)">Completados 🏆</button>
                        <button class="filter-btn" onclick="filterGames('favoritos', this)">Favoritos ❤️</button>
                        <button class="filter-btn" onclick="filterGames('noadquirido', this)">No Adquirido 🛑</button>
                    </div>

                    <!-- Selector Estados (Solo Móvil) -->
                    <select id="mobile-sub-filters" class="mobile-status-select mobile-only-menu" onchange="filterGamesFromSelect(this.value)">
                        <option value="todos">📋 Mostrar Todos los Estados</option>
                        <option value="pendiente">⏳ Por jugar</option>
                        <option value="jugando">🕹️ Jugando</option>
                        <option value="completado">🏆 Completados</option>
                        <option value="favoritos">❤️ Mis Favoritos</option>
                        <option value="noadquirido">🛑 No Adquirido</option>
                    </select>
                </div>

                <!-- Barra de búsqueda -->
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="game-search" placeholder="Buscar juego por nombre..." oninput="searchGames()">
                </div>

                <!-- Rejilla Principal para Cartas de Juegos -->
                <div class="games-grid" id="games-grid"></div>

                <!-- Contenedor Oculto del Planificador (Calendario) -->
                <div id="calendar-container" style="display: none;">
                    <h2 id="calendar-month-title" style="text-align:center; color:#00ff99; margin-bottom:20px;">📅 Planificador</h2>
                    <div class="calendar-weekdays">
                        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                    </div>
                    <div class="calendar-days-grid" id="calendar-days-grid"></div>
                </div>

                <!-- Contenedor Oculto del Setup -->
                <div id="setup-container" style="display: none;">
                    <div class="games-grid" id="setup-grid"></div>
                </div>

                <!-- Contenedor Oculto de los Mapas -->
                <div id="mapas-container" style="display: none;">
                    <div class="games-grid" id="mapas-grid"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal para visualización de mapas a pantalla completa -->
    <div id="mapa-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;" onclick="cerrarMapa()">
        <img id="mapa-gigante" src="" alt="Mapa ampliado" style="max-width:90%; max-height:90%; border-radius:10px; box-shadow:0 0 30px rgba(0,255,153,0.5);">
    </div>

    <!-- Carga del Script lógico -->
    <script src="app.js"></script>
</body>
</html>
