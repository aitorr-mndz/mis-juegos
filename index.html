<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colección de Videojuegos</title>
    <!-- Tu archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="web-container">
        
        <!-- CABECERA -->
        <header class="app-header">
            <h1>🎮 Mi Colección de Videojuegos</h1>
        </header>

        <!-- PANEL DE ESTADÍSTICAS -->
        <section class="stats-container" id="stats-panel">
            <div class="stat-box todos">
                <span class="stat-number" id="count-todos">0</span>
                <span class="stat-label">Total Juegos</span>
            </div>
            <div class="stat-box pendiente">
                <span class="stat-number" id="count-pendiente">0</span>
                <span class="stat-label">Por Jugar ⏳</span>
            </div>
            <div class="stat-box jugando">
                <span class="stat-number" id="count-jugando">0</span>
                <span class="stat-label">Jugando 🕹️</span>
            </div>
            <div class="stat-box completado">
                <span class="stat-number" id="count-completado">0</span>
                <span class="stat-label">Pasados 🏆</span>
            </div>
            <div class="stat-box progreso">
                <span class="stat-number" id="progress-percent">Progreso: 0%</span>
                <span class="stat-label">Progreso Total</span>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>
        </section>

        <!-- FILTROS SUPERIORES Y BUSCADOR -->
        <section class="top-filters-container">
            <div class="search-filter-row">
                
                <!-- Buscador en tiempo real -->
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="game-search" placeholder="Buscar un juego..." oninput="searchGames()">
                </div>

                <!-- Botones de Estado (Se adaptan a PC y Móvil en cuadrícula) -->
                <div class="pc-status-filters" id="sub-filters">
                    <button class="filter-btn active" onclick="filterGames('todos', this)">Todos</button>
                    <button class="filter-btn" onclick="filterGames('pendiente', this)">Por jugar ⏳</button>
                    <button class="filter-btn" onclick="filterGames('jugando', this)">Jugando 🕹️</button>
                    <button class="filter-btn" onclick="filterGames('completado', this)">Completados 🏆</button>
                    <button class="filter-btn" onclick="filterGames('favoritos', this)">Favoritos ❤️</button>
                    <button class="filter-btn" onclick="filterGames('noadquirido', this)">No Adquirido 🔴</button>
                </div>

                <!-- Selector desplegable fallback para móviles antiguos -->
                <select id="mobile-sub-filters" class="mobile-status-dropdown" onchange="filterGamesFromSelect(this.value)">
                    <option value="todos">Todos</option>
                    <option value="pendiente">Por jugar ⏳</option>
                    <option value="jugando">Jugando 🕹️</option>
                    <option value="completado">Completados 🏆</option>
                    <option value="favoritos">Favoritos ❤️</option>
                    <option value="noadquirido">No Adquirido 🔴</option>
                </select>

            </div>
        </section>

        <!-- CONTENIDO PRINCIPAL DE LAS PESTAÑAS -->
        <main class="app-main-content">
            
            <!-- Rejilla de Juegos (Colección Principal y Otros Juegos) -->
            <div id="games-grid" class="games-grid"></div>

            <!-- Contenedor del Calendario / Agenda -->
            <div id="calendar-container" style="display: none;">
                <div id="calendar-month-title"></div>
                <div class="calendar-weekdays">
                    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendar-days-grid" class="calendar-days-grid"></div>
            </div>

            <!-- Contenedor de Mi Setup -->
            <div id="setup-container" style="display: none;">
                <div id="setup-grid" class="games-grid"></div>
            </div>

            <!-- Contenedor de Mapas -->
            <div id="mapas-container" style="display: none;">
                <div id="mapas-grid" class="games-grid"></div>
            </div>

        </main>

        <!-- MODAL PARA AMPLIAR LOS MAPAS -->
        <div id="mapa-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;" onclick="cerrarMapa()">
            <img id="mapa-gigante" src="" alt="Mapa ampliado" style="max-width: 90%; max-height: 90%; object-fit: contain; border: 2px solid #00ff99; border-radius: 8px;">
        </div>

        <!-- MENÚ DE NAVEGACIÓN INFERIOR (MÓVIL / FIJO) -->
        <nav class="main-navigation">
            <button class="nav-item active" onclick="changeCollection('principal', this)">Mi Colección</button>
            <button class="nav-item" onclick="changeCollection('otros', this)">Otros Juegos</button>
            <button class="nav-item" onclick="changeCollection('mapas', this)">Mapas</button>
            <button class="nav-item" onclick="changeCollection('calendario', this)">Mi Calendario</button>
            <button class="nav-item" onclick="changeCollection('setup', this)">Mi Setup</button>
        </nav>

    </div>

    <!-- Tu archivo Script externo de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
