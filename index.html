<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colección de Videojuegos</title>
    
    <!-- Meta tags para evitar el bloqueo de caché agresivo de los navegadores -->
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    
    <!-- Enlace al manifiesto de instalación y estilos con versión dinámica -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div class="web-container">
        
        <!-- CABECERA PRINCIPAL Y CENTRADA -->
        <header class="app-header">
            <h1>🎮 Mi Colección de Videojuegos</h1>
        </header>

        <!-- NAVEGACIÓN PRINCIPAL (Barra inferior nativa en móvil / Menú superior en PC) -->
        <nav class="main-navigation">
            <button class="nav-item active" onclick="changeCollection('principal', this)">
                <span class="nav-icon">🎮</span><span class="nav-text">Mi Colección</span>
            </button>
            <button class="nav-item" onclick="changeCollection('otros', this)">
                <span class="nav-icon">📁</span><span class="nav-text">Otros Juegos</span>
            </button>
            <button class="nav-item" onclick="changeCollection('mapas', this)">
                <span class="nav-icon">🗺️</span><span class="nav-text">Mapas</span>
            </button>
            <button class="nav-item" onclick="changeCollection('calendario', this)">
                <span class="nav-icon">📅</span><span class="nav-text">Mi Calendario</span>
            </button>
            <button class="nav-item" onclick="changeCollection('setup', this)">
                <span class="nav-icon">🖥️</span><span class="nav-text">Mi Setup</span>
            </button>
        </nav>

        <!-- PANEL DE ESTADÍSTICAS PREMIUM -->
        <div class="stats-container" id="stats-panel">
            <div class="stat-box todos">
                <span class="stat-number" id="count-todos">0</span>
                <span class="stat-label">Total Juegos</span>
            </div>
            <div class="stat-box pendiente">
                <span class="stat-number" id="count-pendiente">0</span>
                <span class="stat-label">Por Jugar ⏳</span>
            </div>
            <div class="stat-box jugando">
                <span class="stat-number" id="count-jugando">0</span>
                <span class="stat-label">Jugando 🕹️</span>
            </div>
            <div class="stat-box completado">
                <span class="stat-number" id="count-completado">0</span>
                <span class="stat-label">Pasados 🏆</span>
            </div>
            <div class="stat-box progreso">
                <span class="stat-number" id="progress-percent">Progreso: 0%</span>
                <span class="stat-label">Progreso Total</span>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS SUPERIORES Y BUSCADOR (CORREGIDO Y OPTIMIZADO) -->
        <div class="top-filters-container">
            <div class="search-filter-row">
                
                <!-- 🔍 EL BUSCADOR (Sube arriba ocupando toda la línea en móviles) -->
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="game-search" placeholder="Buscar un juego..." oninput="handleSearch(this.value)">
                </div>

                <!-- 🎛️ BOTONES DE ESTADO (Se ordenan simétricamente en 2 columnas en móvil) -->
                <div class="pc-status-filters" id="sub-filters">
                    <button class="filter-btn active" onclick="filterStatus('todos', this)">Todos</button>
                    <button class="filter-btn" onclick="filterStatus('pendiente', this)">Por jugar ⏳</button>
                    <button class="filter-btn" onclick="filterStatus('jugando', this)">Jugando 🕹️</button>
                    <button class="filter-btn" onclick="filterStatus('completado', this)">Completados 🏆</button>
                    <button class="filter-btn" onclick="filterStatus('favoritos', this)">Favoritos ❤️</button>
                    <button class="filter-btn" onclick="filterStatus('noadquirido', this)">No Adquirido 🔴</button>
                </div>

            </div>
        </div>

        <!-- CONTENEDOR DE CONTENIDOS PRINCIPALES -->
        <main class="app-main-content">
            
            <!-- REJILLA PRINCIPAL DE TARJETA DE JUEGOS (Mi Colección / Otros Juegos) -->
            <div class="games-grid" id="games-grid"></div>

            <!-- APARTADO MI CALENDARIO (REDISEÑO MULTIMES AMPLIO) -->
            <div id="calendar-container" style="display: none;">
                <!-- Título dinámico que inyecta las flechas ◀ y ▶ desde JS -->
                <div id="calendar-month-title"></div> 
                
                <div class="calendar-weekdays">
                    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div class="calendar-days-grid" id="calendar-days-grid"></div>
            </div>

            <!-- APARTADO MI SETUP (REJILLA ADAPTATIVA EN COLUMNAS HORIZONTALES) -->
            <div id="setup-container" style="display: none;">
                <div class="games-grid" id="setup-grid"></div>
            </div>

            <!-- APARTADO MAPAS (REJILLA ADAPTATIVA EN COLUMNAS HORIZONTALES) -->
            <div id="mapas-container" style="display: none;">
                <div class="games-grid" id="mapas-grid"></div>
            </div>

        </main>

    </div>

    <!-- Enlace al motor lógico JavaScript con versión dinámica -->
    <script src="app.js?v=2.0"></script>
</body>
</html>
